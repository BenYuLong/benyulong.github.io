title: BIG BEN's Blog
subtitle: 每天进步一点点~
description: 记录学习、阅读与生活，每天进步一点点。
author: BIG BEN
language: zh-CN
timezone: Asia/Shanghai
url: https://benyulong.github.io
root: /
permalink: :year/:month/:day/:title/
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
include:
  - .nojekyll
skip_render:
  - .nojekyll
new_post_name: :title.md
default_layout: post
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: false
  auto_detect: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 20
category_generator:
  per_page: 20
tag_generator:
  per_page: 20
per_page: 10
pagination_dir: page
theme: ben
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
